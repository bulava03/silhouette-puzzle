# A separate stack for the browser tests: its own project name, port and a
# throwaway database, so it never touches the development data. It builds
# the same application image as docker-compose.yml.
name: silhouette-puzzle-e2e

services:
  mongo:
    image: mongo:7
    tmpfs:
      - /data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: silhouette-puzzle-app
    ports:
      - "8081:8080"
    environment:
      MONGODB_URI: mongodb://mongo:27017/silhouette-puzzle-e2e
    depends_on:
      mongo:
        condition: service_healthy
