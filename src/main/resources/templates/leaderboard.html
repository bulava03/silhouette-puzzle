<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Leaderboard')}"></head>
<body>
<header th:replace="~{fragments :: header('leaderboard')}"></header>

<main class="main">
    <div class="intro__text">
        <span class="eyebrow eyebrow--amber">Hall of fame</span>
        <h1 class="title title--page">Fastest builders</h1>
        <p class="lead">Each player's best run. Faster time wins; on a tie, fewer moves; then whoever got there first.</p>
    </div>

    <nav class="tabs" aria-label="Levels">
        <a class="tab" th:each="tab, iter : ${levels}" th:href="@{/leaderboard(level=${tab.id})}"
           th:text="${#numbers.formatInteger(tab.number, 2)} + ' ' + ${tab.name}"
           th:style="'--accent: ' + ${svg.accent(iter.index)}"
           th:attr="aria-current=${tab.id == level.id} ? 'page' : null">01 Bus</a>
    </nav>

    <div class="podium" th:unless="${#lists.isEmpty(rows)}">
        <div class="card podium__spot" th:each="spot : ${rows}" th:if="${spot.rank <= 3}"
             th:classappend="'podium__spot--' + ${spot.rank}">
            <span class="podium__rank" th:text="'#' + ${spot.rank}">#1</span>
            <span class="podium__name" th:text="${spot.username}">mira</span>
            <span class="podium__run"><th:block th:text="${svg.clock(spot.timeMs)}">00:52</th:block> <span th:text="'· ' + ${spot.moves} + ' moves'">· 21 moves</span></span>
        </div>
    </div>

    <div class="card table-box">
        <table class="results" th:unless="${#lists.isEmpty(rows)}">
            <caption class="visually-hidden" th:text="${level.name} + ' leaderboard'">Bus leaderboard</caption>
            <thead>
            <tr>
                <th scope="col">Rank</th>
                <th scope="col">Player</th>
                <th scope="col">Time</th>
                <th scope="col">Moves</th>
                <th scope="col">Built</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="row : ${rows}" th:with="mine=${me != null and row.username == me.username}"
                th:classappend="${mine} ? 'is-me'">
                <td class="rank" th:text="${row.rank}">1</td>
                <td><strong th:text="${row.username}">mira</strong><span class="you" th:if="${mine}"> (you)</span></td>
                <td class="mono" th:text="${svg.clock(row.timeMs)}">00:52</td>
                <td class="mono" th:text="${row.moves}">21</td>
                <td th:text="${svg.day(row.solvedAt)}">24 Oct</td>
            </tr>
            </tbody>
        </table>
        <p class="empty" th:if="${#lists.isEmpty(rows)}">
            Nobody has built this picture yet. <a th:href="@{/play/{id}(id=${level.id})}">Be the first</a>.
        </p>
    </div>
</main>
</body>
</html>
