<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · Silhouette'">Silhouette</title>
    <link rel="icon" th:href="@{/favicon.svg}" type="image/svg+xml">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header class="site-header" th:fragment="header(active)">
    <div class="site-header__inner">
        <a class="brand" th:href="@{/}">
            <svg width="30" height="30" viewBox="-0.3 -0.3 4.6 4.6" aria-hidden="true">
                <g fill="none" stroke-width="0.14" stroke-linejoin="round">
                    <polygon points="0,0 4,0 2,2" stroke="#F197C2"></polygon>
                    <polygon points="0,0 2,2 0,4" stroke="#3BCFCF"></polygon>
                    <polygon points="4,2 4,4 2,4" stroke="#E4AC59"></polygon>
                    <polygon points="2,2 3,3 2,4 1,3" stroke="#BDA8FC"></polygon>
                </g>
            </svg>
            <span class="brand__name">Silhouette</span>
        </a>
        <nav class="nav" aria-label="Main">
            <a th:href="@{/}" th:attr="aria-current=${active == 'levels'} ? 'page' : null">Levels</a>
            <a th:href="@{/leaderboard}" th:attr="aria-current=${active == 'leaderboard'} ? 'page' : null">Leaderboard</a>
        </nav>
        <div class="account" th:if="${me != null}">
            <span class="account__name"><span class="account__dot"></span><span th:text="${me.username}">alice</span></span>
            <form th:action="@{/logout}" method="post">
                <button class="link-button" type="submit">Log out</button>
            </form>
        </div>
        <div class="account" th:if="${me == null and active != 'login'}">
            <a th:href="@{/login}">Log in</a>
        </div>
    </div>
</header>

</body>
</html>
