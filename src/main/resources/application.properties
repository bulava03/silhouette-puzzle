spring.application.name=silhouette-puzzle

# MongoDB connection. The URI comes from the environment with a local-dev
# default; docker-compose overrides it for the containerized setup.
spring.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/silhouette-puzzle}

# Errors are answered as RFC 9457 problem details (application/problem+json).
spring.mvc.problemdetails.enabled=true

# Allowed overlap and mismatch of a solution, as a fraction of the silhouette
# area. Must stay well below the share of the smallest part of any picture.
app.solution.tolerance=0.01

# OpenAPI: show the Spring Security login endpoint and let Swagger UI send
# the CSRF token from the XSRF-TOKEN cookie.
springdoc.show-login-endpoint=true
springdoc.swagger-ui.csrf.enabled=true
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# How long after its start an attempt can be submitted. The TTL index from
# db/changelog/003 removes attempts after 48 hours; until then a late submission
# still finds its attempt and gets 410 rather than 404.
app.attempts.lifetime=24h
